[project]
name = "nexus-ai"
version = "0.1.0"
description = "Enterprise knowledge intelligence and agentic AI platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.2,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "PyJWT>=2.9,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "structlog>=24.4,<26.0",
  "pgvector>=0.3,<1.0",
  "google-genai>=1.0,<2.0",
  "langgraph>=0.2,<2.0",
  "redis>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/api/tests"]
pythonpath = ["services/api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.packages.find]
where = ["services/api"]
include = ["app*"]
